<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mijn Winkelmandje</title>
    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
</head>
<body>
<div class="container">
    <h2>Mijn Winkelmandje</h2>
    <table th:if="${winkelmand.size()} > 0">
        <thead>
            <tr>
                <th>Product</th>
                <th>Aantal</th>
                <th>Actie</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${winkelmand}">
                <td th:text="${item.naam}"></td>
                <td th:text="${item.aantal}"></td>
                <td>
                    <form th:action="@{/winkelmand/verwijderen}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="productId" th:value="${item.productId}" />
                        <button type="submit" class="btn-remove">Verwijderen</button>
                    </form>
                    <form th:action="@{/winkelmand/verwijderAlles}" method="post" style="display:inline; margin-left:0.3rem;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="productId" th:value="${item.productId}" />
                        <button type="submit" class="btn-remove" style="background:#b71c1c;">Verwijder alles</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:if="${winkelmand.size()} == 0" style="margin-bottom:1.5rem;">Je winkelmandje is leeg.</div>
    <form th:action="@{/checkout}" method="get" th:if="${winkelmand.size()} > 0" style="margin-top:1rem;">
        <button type="submit" class="btn">Checkout</button>
    </form>
    <a th:href="@{/catalogus}" class="btn" style="margin-top:0.5rem; display:inline-block;">Terug naar catalogus</a>
</div>
</body>
</html>
