<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mijn Winkelmandje</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; }
        h2 { color: #2c3e50; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.7rem; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f9f9f9; }
    </style>
</head>
<body>
<div class="container">
    <h2>Mijn Winkelmandje</h2>
    <table th:if="${winkelmand.size()} > 0">
        <thead>
            <tr>
                <th>Product</th>
                <th>Aantal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${winkelmand}">
                <td th:text="${item.naam}"></td>
                <td th:text="${item.aantal}"></td>
            </tr>
        </tbody>
    </table>
    <div th:if="${winkelmand.size()} == 0">Je winkelmandje is leeg.</div>
    <form th:action="@{/checkout}" method="get" th:if="${winkelmand.size()} > 0" style="margin-top:1rem;">
        <button type="submit" class="btn">Checkout</button>
    </form>
    <a th:href="@{/catalogus}" class="btn">Terug naar catalogus</a>
</div>
</body>
</html>
