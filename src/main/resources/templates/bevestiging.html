<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bevestiging</title>
    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
</head>
<body>
<div class="container">
    <h2 style="margin-bottom: 2rem;">Reservatie bevestigd</h2>
    <div class="bevestiging" style="font-size:1.5rem; color:#219150; margin-bottom:1.5rem; font-weight:bold;" th:text="${bevestiging}"></div>
    <div th:if="${afhaaldatum != null}" style="font-size:1.15rem; margin-bottom:0.7rem;">
        <b>Afhaaldatum:</b> <span th:text="${afhaaldatum}"></span>
    </div>
    <div th:if="${einddatum != null}" style="font-size:1.15rem; margin-bottom:0.7rem;">
        <b>Terugbrengdatum:</b> <span th:text="${einddatum}"></span>
    </div>
    <div th:if="${opmerkingen != null && !#strings.isEmpty(opmerkingen)}" style="margin-top:0.7rem; font-size:1.1rem;">
        <b>Opmerkingen:</b> <span th:text="${opmerkingen}"></span>
    </div>
    <a th:href="@{/catalogus}" class="btn" style="margin-top:2rem;">Terug naar catalogus</a>
</div>
</body>
</html>
