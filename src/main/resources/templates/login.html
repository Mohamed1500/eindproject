<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>Login</title>
	<link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
</head>
<body class="centered-page">
	<div class="login-container">
		<h2>Login</h2>
		<form th:action="@{/login}" method="post">
			<div class="form-group">
				<label for="username">Gebruikersnaam:</label>
				<input type="text" id="username" name="username" required autocomplete="username">
			</div>
			<div class="form-group">
				<label for="password">Wachtwoord:</label>
				<input type="password" id="password" name="password" required autocomplete="current-password">
			</div>
			<button type="submit" class="btn">Login</button>
		</form>
		<div th:if="${param.error}" id="melding" style="background:rgba(239,68,68,0.15); color:#ef4444;">Foutieve gebruikersnaam of wachtwoord.</div>
		<div th:if="${param.logout}" id="melding" style="background:rgba(34,197,94,0.15); color:#22c55e;">Je bent uitgelogd.</div>
		<div th:if="${param.registerSuccess}" id="melding" style="background:rgba(34,197,94,0.15); color:#22c55e;">Registratie succesvol! Je kan nu inloggen.</div>
	</div>
</body>
</html>
