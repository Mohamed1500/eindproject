<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; }
        h2 { color: #2c3e50; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.7rem; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f9f9f9; }
        .btn { background: #27ae60; color: #fff; border: none; border-radius: 5px; padding: 0.7rem 1.5rem; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #219150; }
    </style>
</head>
<body>
<div class="container">
    <h2>Bevestig je reservatie</h2>
    <table th:if="${winkelmand.size()} > 0">
        <thead>
            <tr>
                <th>Product</th>
                <th>Aantal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${winkelmand}">
                <td th:text="${item.naam}"></td>
                <td th:text="${item.aantal}"></td>
            </tr>
        </tbody>
    </table>
    <div th:if="${winkelmand.size()} == 0">Je winkelmandje is leeg.</div>
    <form th:action="@{/checkout/bevestigen}" method="post" th:if="${winkelmand.size()} > 0">
        <button type="submit" class="btn">Bevestigen</button>
    </form>
    <a th:href="@{/winkelmand}" class="btn">Terug naar winkelmandje</a>
</div>
</body>
</html>
