<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
</head>
<body>
    <div class="container">
        <div th:if="${error}" id="melding" style="margin-bottom:1rem;">[[${error}]]</div>
        <h2>Bevestig je reservatie</h2>
        <table th:if="${winkelmand.size()} > 0">
        <thead>
            <tr>
                <th>Product</th>
                <th>Aantal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${winkelmand}">
                <td th:text="${item.naam}"></td>
                <td th:text="${item.aantal}"></td>
            </tr>
        </tbody>
    </table>
    <div th:if="${winkelmand.size()} == 0">Je winkelmandje is leeg.</div>
    <div th:if="${error}" style="color:#e74c3c; font-weight:bold; margin-bottom:1rem;">[[${error}]]</div>
    <form th:action="@{/checkout/bevestigen}" method="post" th:if="${winkelmand.size()} > 0" style="margin-top:2rem;">
        <div style="margin-bottom:1.2rem;">
            <label for="afhaaldatum" style="font-weight:500; color:#2c3e50;">Afhaaldatum:</label><br>
            <input type="date" id="afhaaldatum" name="afhaaldatum" required style="padding:0.5rem; border-radius:5px; border:1px solid #ccc; margin-top:0.3rem; width: 60%;" />
        </div>
        <div style="margin-bottom:1.2rem;">
            <label for="opmerkingen" style="font-weight:500; color:#2c3e50;">Opmerkingen:</label><br>
            <textarea id="opmerkingen" name="opmerkingen" rows="3" style="padding:0.5rem; border-radius:5px; border:1px solid #ccc; margin-top:0.3rem; width: 90%; resize:vertical;"></textarea>
        </div>
        <button type="submit" class="btn">Bevestigen</button>
    </form>
    <a th:href="@{/winkelmand}" class="btn">Terug naar winkelmandje</a>
</div>
</body>
</html>
