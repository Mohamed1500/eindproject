<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Productdetail</title>
    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
</head>
<body>
<div class="container" style="max-width: 480px; margin: 4rem auto; background: var(--bg-card); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); padding: 2.2rem 2rem 2rem 2rem;">
    <h2 th:text="${product.naam}" style="color: var(--accent); text-align: center; margin-bottom: 1.2rem;"></h2>
    <div class="product-info" style="margin-bottom: 1.5rem;">
        <div style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 0.5rem;"><b>Categorie:</b> <span th:text="${product.categorie}"></span></div>
        <div style="color: var(--text-main); font-size: 1.08rem; margin-bottom: 0.5rem;"><b>Beschrijving:</b> <span th:text="${product.beschrijving}"></span></div>
        <div style="color: var(--success); font-size: 1.05rem;"><b>Beschikbaar:</b> <span th:text="${product.voorraad}"></span></div>
    </div>
    <form th:action="@{/winkelmand/toevoegen}" method="post" style="margin-top:1rem; display:inline-block;">
        <input type="hidden" name="productId" th:value="${product.id}" />
        <button type="submit" class="btn">In winkelmand</button>
    </form>
    <a th:href="@{/catalogus}" class="btn" style="margin-left:0.7rem;">Terug naar catalogus</a>
</div>
</body>
</html>
