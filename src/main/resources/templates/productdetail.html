<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Productdetail</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 2rem auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; }
        h2 { color: #2c3e50; text-align: center; }
        .product-img { max-width: 100%; height: 180px; object-fit: contain; margin-bottom: 1rem; display: block; margin-left: auto; margin-right: auto; }
        .btn { background: #3498db; color: #fff; border: none; border-radius: 5px; padding: 0.7rem 1.5rem; margin: 0.5rem; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="${product.naam}"></h2>
    <img class="product-img" th:src="@{'/images/' + ${product.afbeeldingUrl}}" th:alt="${product.naam}" />
    <div><b>Categorie:</b> <span th:text="${product.categorie}"></span></div>
    <div><b>Beschrijving:</b> <span th:text="${product.beschrijving}"></span></div>
    <div><b>Beschikbaar:</b> <span th:text="${product.voorraad}"></span></div>
    <form th:action="@{/winkelmand/toevoegen}" method="post" style="margin-top:1rem;">
        <input type="hidden" name="productId" th:value="${product.id}" />
        <button type="submit" class="btn">In winkelmand</button>
    </form>
    <a th:href="@{/catalogus}" class="btn">Terug naar catalogus</a>
</div>
</body>
</html>
