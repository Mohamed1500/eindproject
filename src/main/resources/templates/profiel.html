<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mijn Profiel</title>
    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
</head>
<body>
<div class="container">
    <div class="profile-circle" th:text="${username.substring(0,1).toUpperCase()}"></div>
    <div class="info">
        <div class="label">Gebruikersnaam</div>
        <div th:text="${username}" style="font-weight:bold;"></div>
    </div>
    <div class="info">
        <div class="label">E-mailadres</div>
        <div th:text="${email}" style="font-weight:bold;"></div>
    </div>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn">Uitloggen</button>
    </form>
    <button onclick="window.history.back()" class="btn" style="background:#3498db; margin-top:1.5rem;">Terug</button>
</div>
</body>
</html>
