<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mijn Profiel</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 420px;
            margin: 3.5rem auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 6px 32px rgba(52,152,219,0.13), 0 1.5px 6px rgba(44,62,80,0.07);
            padding: 2.7rem 2.2rem 2.2rem 2.2rem;
            text-align: center;
            position: relative;
        }
        .profile-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3498db 60%, #6dd5fa 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.7rem;
            font-weight: bold;
            margin: 0 auto 1.3rem auto;
            box-shadow: 0 2px 8px rgba(52,152,219,0.18);
        }
        .info {
            margin-bottom: 1.3rem;
            background: #f7fafd;
            border-radius: 8px;
            padding: 0.7rem 0.5rem;
            box-shadow: 0 1px 4px rgba(52,152,219,0.07);
        }
        .label {
            color: #3498db;
            font-size: 1em;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }
        .btn {
            background: linear-gradient(135deg, #e74c3c 60%, #ff7675 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.8rem 1.7rem;
            font-size: 1.08rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            margin-top: 1.3rem;
            box-shadow: 0 2px 8px rgba(231,76,60,0.10);
        }
        .btn:hover {
            background: linear-gradient(135deg, #c0392b 60%, #ff7675 100%);
            box-shadow: 0 4px 16px rgba(231,76,60,0.18);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="profile-circle" th:text="${username.substring(0,1).toUpperCase()}"></div>
    <div class="info">
        <div class="label">Gebruikersnaam</div>
        <div th:text="${username}" style="font-weight:bold;"></div>
    </div>
    <div class="info">
        <div class="label">E-mailadres</div>
        <div th:text="${email}" style="font-weight:bold;"></div>
    </div>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn">Uitloggen</button>
    </form>
    <button onclick="window.history.back()" class="btn" style="background:#3498db; margin-top:1.5rem;">Terug</button>
</div>
</body>
</html>
