<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catalogus</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 2rem auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; }
        h2 { color: #2c3e50; text-align: center; }
        .producten { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }
        .product { background: #f9f9f9; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); padding: 1rem; width: 220px; text-align: center; }
        .product img { max-width: 100%; height: 120px; object-fit: contain; margin-bottom: 0.5rem; }
        .product h3 { margin: 0.5rem 0 0.2rem 0; }
        .product .categorie { color: #888; font-size: 0.95em; margin-bottom: 0.5rem; }
        .product .voorraad { color: #27ae60; font-size: 0.95em; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <h2>Catalogus</h2>
    <form method="get" style="text-align:center; margin-bottom:2rem;">
        <input type="text" name="zoek" placeholder="Zoek op naam..." th:value="${zoek}" style="padding:0.5rem; width:200px;" />
        <select name="categorie" style="padding:0.5rem;">
            <option value="">Alle categorieën</option>
            <option value="Belichting" th:selected="${categorie} == 'Belichting'">Belichting</option>
            <option value="Podium" th:selected="${categorie} == 'Podium'">Podium</option>
            <option value="Kabel" th:selected="${categorie} == 'Kabel'">Kabel</option>
            <option value="Controlepanelen" th:selected="${categorie} == 'Controlepanelen'">Controlepanelen</option>
            <option value="Accessoire" th:selected="${categorie} == 'Accessoire'">Accessoire</option>
        </select>
        <button type="submit" class="btn">Zoeken</button>
    </form>
    <div style="text-align:right; margin-bottom:1rem;">
        <a th:href="@{/winkelmand}" class="btn">Mijn winkelmandje</a>
    </div>
    <div class="producten">
        <div class="product" th:each="product : ${producten}">
            <img th:src="@{'/images/' + ${product.afbeeldingUrl}}" th:alt="${product.naam}" />
            <h3 th:text="${product.naam}"></h3>
            <div class="categorie" th:text="${product.categorie}"></div>
            <div class="voorraad">Beschikbaar: <span th:text="${product.voorraad}"></span></div>
            <div th:text="${product.beschrijving}"></div>
            <form th:action="@{/winkelmand/toevoegen}" method="post" style="margin-top:0.5rem; display:inline-block;">
                <input type="hidden" name="productId" th:value="${product.id}" />
                <button type="submit" class="btn">In winkelmand</button>
            </form>
            <a th:href="@{'/product/' + ${product.id}}" class="btn" style="margin-top:0.5rem; display:inline-block;">Details</a>
        </div>
    </div>
</div>
</body>
</html>
